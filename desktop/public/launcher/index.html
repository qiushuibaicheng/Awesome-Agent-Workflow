<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AAW 启动器</title>
    <link rel="stylesheet" href="launcher.css" />
    <script src="tauri-bridge.js" defer></script>
    <script src="dock.js" defer></script>
    <script src="launcher.js" defer></script>
  </head>
  <body>
    <header>
      <label class="search"
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 4 4" /></svg
        ><input
          id="query"
          aria-label="搜索功能"
          placeholder="搜索功能、工具与工作流"
          autocomplete="off"
      /></label>
      <button
        id="settings-open"
        class="brand"
        title="启动器设置"
        aria-label="启动器设置"
      >
        A<span>✦</span>
      </button>
    </header>
    <main id="content">
      <section aria-labelledby="caption">
        <div class="section-label">
          <h2 id="caption">最近使用</h2>
          <button id="expand">查看全部最近</button>
        </div>
        <ul id="results" class="grid" aria-label="最近使用"></ul>
        <p id="empty" class="empty" hidden></p>
      </section>
      <section id="pinned-section" aria-labelledby="pinned-title">
        <div class="section-label">
          <h2 id="pinned-title">已固定</h2>
          <button id="all">全部功能 <span aria-hidden="true">›</span></button>
        </div>
        <ul id="pinned" class="grid" aria-label="已固定功能"></ul>
        <p id="pin-empty" class="empty" hidden>
          在全部功能中点击星标，将常用功能固定在这里。
        </p>
      </section>
    </main>
    <section id="dock" aria-label="贴边工具栏" hidden>
      <nav id="dock-items" aria-label="快捷工具"></nav>
      <p id="dock-caption" aria-hidden="true"></p>
    </section>
    <section id="settings" aria-label="启动器设置" hidden>
      <div class="section-label">
        <h2>启动器设置</h2>
        <button id="settings-close">返回</button>
      </div>
      <form id="surface-form" hidden>
        <fieldset>
          <legend>启动方式</legend>
          <div class="surface-options">
            <label class="surface-option">
              <input type="radio" name="surface" value="keyboard" checked />
              <span
                ><strong>快捷键小窗</strong
                ><small>按组合键打开居中搜索</small></span
              >
            </label>
            <label class="surface-option">
              <input type="radio" name="surface" value="edge" />
              <span
                ><strong>快捷键 + 贴边工具栏</strong
                ><small>在选定的屏幕边缘停留即可唤出</small></span
              >
            </label>
          </div>
        </fieldset>
        <fieldset id="dock-location" hidden>
          <legend>工具栏位置</legend>
          <div class="dock-position-settings">
            <div id="dock-preview" data-side="right">
              <span aria-hidden="true">屏幕预览</span>
              <button
                type="button"
                id="dock-handle"
                tabindex="-1"
                aria-hidden="true"
                title="拖动工具栏"
              >
                •••
              </button>
            </div>
            <div class="dock-position-fields">
              <label for="dock-side">贴边方向</label>
              <select id="dock-side">
                <option value="left">左侧</option>
                <option value="right" selected>右侧</option>
                <option value="top">上侧</option>
                <option value="bottom">下侧</option>
              </select>
              <label for="dock-offset">沿边位置</label>
              <input
                id="dock-offset"
                type="range"
                min="0"
                max="100"
                value="50"
              />
              <small>可拖动预览里的工具栏</small>
            </div>
          </div>
        </fieldset>
        <div class="surface-controls">
          <label for="edge-delay">停留时间</label>
          <select id="edge-delay">
            <option value="200">0.2 秒</option>
            <option value="350">0.35 秒</option>
            <option value="500">0.5 秒</option>
            <option value="750">0.75 秒</option>
            <option value="1000">1 秒</option>
          </select>
          <button class="primary" type="submit">应用启动方式</button>
        </div>
        <p id="surface-status" role="status" hidden></p>
      </form>
      <label for="accelerator">全局唤起快捷键</label>
      <p>在任何窗口快速打开 AAW。默认 Alt + Space。</p>
      <form id="shortcut-form">
        <input
          id="accelerator"
          aria-label="全局唤起快捷键"
          aria-describedby="shortcut-hint"
          placeholder="按下组合键"
          autocomplete="off"
          spellcheck="false"
          readonly
        /><button class="primary" type="submit">保存快捷键</button
        ><button type="button" id="reset-shortcut">恢复默认</button>
      </form>
      <p id="shortcut-hint" role="status">
        点击输入框后直接按组合键（需含 Ctrl / Alt / Shift 之一），例如
        Ctrl+Shift+Space。
      </p>
    </section>
    <p id="message" role="status" hidden></p>
    <footer>
      <span
        ><kbd>↑ ↓ ← →</kbd> 选择 <kbd>Enter</kbd> 打开
        <button id="close"><kbd>Esc</kbd> 收起</button></span
      ><button id="shortcut" title="更改快捷键"></button>
    </footer>
  </body>
</html>
