<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>AAW 工具</title>
  <link rel="stylesheet" href="launcher.css">
  <script src="launcher.js" defer></script>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true">✦</div>
    <div><h1>工具</h1><p>快速打开个人工具</p></div>
    <button id="close" aria-label="隐藏小窗"><kbd>Esc</kbd></button>
  </header>
  <main>
    <label class="search">
      <span aria-hidden="true">⌕</span>
      <input id="query" aria-label="搜索工具" placeholder="搜索工具名称或标识…" autocomplete="off">
    </label>
    <div class="section-label"><span id="caption">最近使用</span><span id="count"></span></div>
    <ul id="results" aria-label="工具列表"></ul>
    <p id="message" role="status" hidden></p>
  </main>
  <footer><span><kbd>↑</kbd><kbd>↓</kbd> 选择 <kbd>↵</kbd> 打开</span><span id="shortcut"></span></footer>
</body>
</html>
